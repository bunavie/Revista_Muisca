<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista Digital Muisca - Flipbook</title>
    <!-- Importamos la librería de Flipbook -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Fondo unificado con viñeta para toda la pantalla */
            background: radial-gradient(circle, #3d2010 0%, #1c0e05 100%);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 85vh;
            overflow: visible; 
            background: transparent !important;
        }

        #book {
            overflow: visible !important;
            background: transparent !important;
            box-shadow: none !important;
            /* Transición suave para el centrado/desplazamiento */
            transition: transform 0.4s ease-in-out;
        }

        /* Eliminamos cualquier cuadro de fondo o contenedor sólido de la librería */
        .stf__wrapper, .stf__parent, .stf__item {
            background: transparent !important;
        }

        .page {
            background: transparent !important;
            overflow: hidden;
        }

        /* Sombra natural y limpia aplicada únicamente a la portada o contraportada cuando están cerradas */
        .page.has-shadow {
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .instructions {
            position: absolute;
            bottom: 15px;
            font-size: 13px;
            color: #d4b28c;
            background: rgba(28, 14, 5, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #5a3215;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        /* Panel lateral de redes sociales para la contraportada */
        #social-sidebar {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%) translateX(-50px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease-in-out;
            background: rgba(28, 14, 5, 0.9);
            border: 1px solid #5a3215;
            padding: 20px 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        #social-sidebar.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) translateX(0);
        }

        .sidebar-text {
            font-size: 12px;
            color: #d4b28c;
            text-align: center;
            max-width: 130px;
            line-height: 1.4;
            margin: 0;
            font-style: italic;
        }

        .sidebar-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: block;
        }

        .sidebar-icon:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <div id="book-container">
        <!-- Contenedor del libro -->
        <div id="book"></div>
    </div>

    <div class="instructions">Haz clic y arrastra las esquinas de la revista para abrirla y hojearla</div>

    <!-- Menú lateral que aparece en la última página -->
    <div id="social-sidebar">
        <p class="sidebar-text">Explora nuestros contenidos oficiales:</p>
        <a href="https://youtu.be/zNTu51NcPUM?si=nqlUohw675ayUsct" target="_blank" title="YouTube">
            <img src="assets/yt.png" alt="YouTube" class="sidebar-icon">
        </a>
        <a href="https://www.instagram.com/reel/DehZQJvtDRx/?utm_source=ig_web_copy_link&cplk=MzRlODBiNWFlZA==&srtk=MzRlODBiNWFlZA==" target="_blank" title="Instagram">
            <img src="assets/ig.png" alt="Instagram" class="sidebar-icon">
        </a>
        <a href="https://bunavie.github.io/Revista_Muisca/" target="_blank" title="Repositorio GitHub">
            <img src="assets/git.png" alt="GitHub" class="sidebar-icon">
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const bookElement = document.getElementById('book');
            const pageWidth = 420; // Ancho optimizado para encajar perfecto
            const socialSidebar = document.getElementById('social-sidebar');

            for (let i = 1; i <= 14; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                
                const img = document.createElement('img');
                img.src = `Mesa de trabajo ${i}-100.jpg`;
                img.alt = `Página ${i}`;
                
                pageDiv.appendChild(img);
                bookElement.appendChild(pageDiv);
            }

            const pageFlip = new St.PageFlip(bookElement, {
                width: pageWidth,     
                height: 580,     
                size: 'fixed', 
                minWidth: 300,
                maxWidth: 600,
                minHeight: 400,
                maxHeight: 800,
                maxShadowOpacity: 0.5, 
                showCover: true,       
                mobileScrollSupport: true // <-- Añadido aquí para mejorar la interacción táctil
            });

            // Cargamos las páginas usando los elementos HTML creados
            pageFlip.loadFromHTML(bookElement.querySelectorAll('.page'));

            const pages = document.querySelectorAll('.page');

            // Función para actualizar la posición y la sombra según la página actual
            function updateBookState(currentIndex) {
                pages.forEach((p, idx) => {
                    if ((currentIndex === 0 && idx === 0) || (currentIndex === pages.length - 1 && idx === pages.length - 1)) {
                        p.classList.add('has-shadow');
                    } else {
                        p.classList.remove('has-shadow');
                    }
                });

                // Centrado dinámico cuando el libro está cerrado en los extremos
                if (currentIndex === 0) {
                    bookElement.style.transform = `translateX(-${pageWidth / 2}px)`;
                    socialSidebar.classList.remove('visible');
                } else if (currentIndex === pages.length - 1) {
                    bookElement.style.transform = `translateX(${pageWidth / 2}px)`;
                    socialSidebar.classList.add('visible'); // Muestra el panel lateral en la última página
                } else {
                    bookElement.style.transform = `translateX(0px)`;
                    socialSidebar.classList.remove('visible');
                }
            }

            // Aplicar estado inicial en la portada
            updateBookState(0);

            // Sincronizar el movimiento al interactuar
            pageFlip.on('changeState', (e) => {
                const targetIndex = pageFlip.getCurrentPageIndex();
                if (e.data === 'fold' || e.data === 'flipping') {
                    updateBookState(targetIndex);
                }
            });

            pageFlip.on('flip', (e) => {
                updateBookState(e.data);
            });
        });
    </script>

</body>
</html>
